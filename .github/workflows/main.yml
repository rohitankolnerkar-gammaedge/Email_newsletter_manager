name: CI/CD - Test, Build & Deploy Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: rohitankolnerkargamma/email-newsletter-manager

    steps:
   
      - name: Checkout repository
        uses: actions/checkout@v3

     
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

    
      - name: Build Docker image for testing
        run: |
          docker build --target test -t newsletter-manager-test .

   
      - name: Run tests
        run: |
          docker run --rm newsletter-manager-test pytest -v

  
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

   
      - name: Build final Docker image
        run: |
          docker build -t $DOCKER_IMAGE:latest -t $DOCKER_IMAGE:${{ github.sha }} .

   
      - name: Push Docker images
        run: |
          docker push $DOCKER_IMAGE:latest
          docker push $DOCKER_IMAGE:${{ github.sha }}

      - name: Install Railway CLI
        run: |
          curl -sSL https://raw.githubusercontent.com/railwayapp/cli/master/install.sh | sh
          railway --version

      - name: Log in to Railway
        run: |
          railway login --ci ${{ secrets.RAILWAY_TOKEN }}

   
      - name: Deploy to Railway
        run: |
          railway up --branch main --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
