version: "3.3"

services:
  app:
    image: rohitankolnerkargamma/email-newsletter-manager:latest
    container_name: email-newsletter-manager
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    image: rohitankolnerkargamma/email-newsletter-manager:latest
    container_name: email-newsletter-worker
    env_file:
      - .env
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
